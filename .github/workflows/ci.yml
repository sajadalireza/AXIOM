# AXIOM WP-105 — pull-request CI baseline.
#
# Validates unit tests, release lint, debug assembly, and Room schema integrity
# on every pull request (and on pushes to main) WITHOUT any signing credentials
# or backend/Gemini secrets. This is deliberately separate from release.yml,
# which builds and signs release artifacts on pushes to main and needs secrets.
#
# Action versions are pinned to immutable commit SHAs; the human-readable tag is
# recorded in the trailing comment.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref so stale CI does not waste minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. No job below reads any secret.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Run release lint
        run: ./gradlew lintRelease --stacktrace --no-daemon
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          retention-days: 14
          if-no-files-found: ignore

  assemble-debug:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Assemble debug APK (unsigned, diagnostic only)
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: ignore

  room-schema:
    name: Room Schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Regenerate Room schema
        run: ./gradlew :app:kspDebugKotlin --stacktrace --no-daemon
      - name: TEMP WP-204 export generated schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp204-generated-schemas
          path: app/schemas/com.axiom.app.data.local.AxiomDatabase/*.json
          if-no-files-found: error
      - name: Fail on uncommitted schema drift
        run: |
          # Detects both modified tracked schemas and newly generated untracked ones.
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::Room schema drift — regenerate with ':app:kspDebugKotlin' and commit app/schemas."
            git status --porcelain -- app/schemas
            git --no-pager diff -- app/schemas || true
            exit 1
          fi
          echo "Room schema is in sync with committed app/schemas."
